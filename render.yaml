services:
  - type: web
    name: sociai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m sociai.web
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SOCIAI_GLOBAL_DAILY_LIMIT
        value: "100"
      - key: SOCIAI_TRUST_PROXY
        value: "1"
