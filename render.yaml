services:
  - type: web
    name: sociai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m sociai.web
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SOCIAI_ACCESS_CODES
        sync: false
      - key: SOCIAI_DAILY_LIMIT
        value: "20"
      - key: SOCIAI_GLOBAL_DAILY_LIMIT
        value: "200"
